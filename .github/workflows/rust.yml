name: Rust

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - name: cargo fmt
        run: |
          cargo fmt --check
      - name: tests
        run: |
          make tests
      - name: exhaustive differential round trips
        run: cargo test --release --test differential -- --include-ignored --nocapture

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@cargo-hack
      - run: cargo hack --rust-version --no-dev-deps check
